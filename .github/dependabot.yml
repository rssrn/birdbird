version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "07:00"
      timezone: "Europe/London"
    reviewers:
      - "rssrn"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "07:00"
      timezone: "Europe/London"
    reviewers:
      - "rssrn"
    # TEMPORARY (added 2026-07-13): hold opencv-python on the 4.x line while the
    # brand-new 5.0.0 major (released 2026-07-02, removed the legacy C API,
    # requires C++17) settles and gets its first point releases. 4.13.0 has no
    # known CVEs. Remove this ignore once a 5.0.x fix release lands and we've
    # tested cv2.VideoCapture / frame decoding against real AVI footage — at
    # which point dependabot will re-propose the 5.x bump automatically.
    ignore:
      - dependency-name: "opencv-python"
        versions: [">=5.0.0"]
      # mpmath / h5py: transitive deps we pin explicitly in pyproject.toml to
      # match upstream's declared ceilings. sympy 1.14.0 requires mpmath<1.4 and
      # tensorflow 2.21.0 requires h5py<3.15.0 (verified via PyPI metadata
      # 2026-07-13). Dependabot otherwise bumps past these AND relaxes our
      # pyproject bounds, installing officially-unsupported combos. Hold until
      # sympy/tensorflow themselves raise their ceilings, then bump in lockstep.
      - dependency-name: "mpmath"
        versions: [">=1.4.0"]
      - dependency-name: "h5py"
        versions: [">=3.15.0"]
      # TEMPORARY (added 2026-07-13): hold torch on 2.12.x. The 2.13.0 bump
      # (PR #44) re-pinned cuda-toolkit to 13.3.1 and 17 nvidia-* packages,
      # but torch 2.13.0 itself declares cuda-toolkit==13.0.3 as a
      # requirement — a hard lockfile conflict flagged by labro-bot's review
      # of that PR. Remove this ignore once torch publishes a point release
      # whose declared cuda-toolkit/nvidia-* pins are internally consistent,
      # and re-verify the resolved lockfile installs cleanly before merging.
      - dependency-name: "torch"
        versions: [">=2.13.0"]
      # TEMPORARY (added 2026-07-14, corrected 2026-07-14 after PR #46 slipped
      # a cuda-toolkit 13.3.0 bump past the first version of this rule): hold
      # torchvision and the cuda-toolkit/nvidia-* transitive deps at their
      # current versions. PR #45 showed the torch ignore rule above doesn't
      # stop these from bumping independently: torchvision 0.28.0 requires
      # torch==2.13.0 exactly (conflicts with the torch<2.13.0 hold), and
      # torch 2.12.1 declares an EXACT pin on cuda-toolkit==13.0.2 (any bump
      # above that, not just >=13.3.1, breaks resolution — confirmed via
      # `pip install --dry-run` against PR #46's lockfile). Remove these
      # ignores once torch moves to 2.13.x (see the ignore above), then bump
      # torchvision/cuda-toolkit/nvidia-* back in lockstep and re-verify the
      # lockfile resolves.
      - dependency-name: "torchvision"
        versions: [">=0.28.0"]
      - dependency-name: "cuda-toolkit"
        versions: [">=13.0.3"]
      - dependency-name: "nvidia-*"
        versions: [">=0"]
    groups:
      pip-all:
        patterns:
          - "*"
