version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "07:00"
      timezone: "Europe/London"
    reviewers:
      - "rssrn"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "07:00"
      timezone: "Europe/London"
    reviewers:
      - "rssrn"
    # TEMPORARY (added 2026-07-13): hold opencv-python on the 4.x line while the
    # brand-new 5.0.0 major (released 2026-07-02, removed the legacy C API,
    # requires C++17) settles and gets its first point releases. 4.13.0 has no
    # known CVEs. Remove this ignore once a 5.0.x fix release lands and we've
    # tested cv2.VideoCapture / frame decoding against real AVI footage — at
    # which point dependabot will re-propose the 5.x bump automatically.
    ignore:
      - dependency-name: "opencv-python"
        versions: [">=5.0.0"]
      # mpmath / h5py: transitive deps we pin explicitly in pyproject.toml to
      # match upstream's declared ceilings. sympy 1.14.0 requires mpmath<1.4 and
      # tensorflow 2.21.0 requires h5py<3.15.0 (verified via PyPI metadata
      # 2026-07-13). Dependabot otherwise bumps past these AND relaxes our
      # pyproject bounds, installing officially-unsupported combos. Hold until
      # sympy/tensorflow themselves raise their ceilings, then bump in lockstep.
      - dependency-name: "mpmath"
        versions: [">=1.4.0"]
      - dependency-name: "h5py"
        versions: [">=3.15.0"]
      # PERMANENT (2026-10-25): Dependabot never bumps the torch stack. torch
      # pins its CUDA deps EXACTLY (cuda-toolkit, nvidia-cudnn/nccl/nvshmem/
      # cusparselt, triton) and torchvision pins torch, so bumping any one of
      # them alone breaks the lockfile. Dependabot did exactly that in #44,
      # #45, #46 (cuda-toolkit/nvidia-*) and #62 (triton). Upgrade the stack
      # deliberately by re-running the pip-compile command in requirements.txt's
      # header with --upgrade-package for torch, torchvision, triton, cuda-* and
      # each nvidia-* package, then sync .venv and smoke-test `birdbird filter`.
      # Last done 2026-10-25: torch 2.12.1 -> 2.14.1 (closes #48).
      - dependency-name: "torch"
      - dependency-name: "torchvision"
      - dependency-name: "triton"
      - dependency-name: "cuda-*"
      - dependency-name: "nvidia-*"
      # python-dateutil (added 2026-10-25): botocore 1.43.x requires
      # python-dateutil<3.0.0, but PR #69 bumped it to 3.0.0 and the lockfile
      # failed to resolve. Remove once botocore raises its ceiling.
      - dependency-name: "python-dateutil"
        versions: [">=3.0.0"]
    groups:
      pip-all:
        patterns:
          - "*"
